paths:
  /admin/promotions:
    get:
      tags: [Promotions]
      summary: "List promotions"
      operationId: "promotions.list"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    
    post:
      tags: [Promotions]
      summary: "Create promotion"
      operationId: "promotions.create"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /riders/me/promotions/active:
    get:
      tags: [Promotions]
      summary: "Get active rider promotions"
      operationId: "promotions.getRiderActive"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"