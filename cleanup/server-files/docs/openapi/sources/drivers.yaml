paths:
  /drivers/me:
    get:
      tags:
        - Drivers
      summary: Get current driver profile
      description: Retrieve the authenticated driver's profile information
      operationId: getDriverProfile
      responses:
        "200":
          description: Driver profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /drivers/me/rides:
    get:
      tags:
        - Drivers
      summary: Get driver's rides
      description: Retrieve the authenticated driver's ride history
      operationId: getDriverRides
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Rides retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Ride"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /drivers/${driverId}/tips?${params.toString()}:
    get:
      tags:
        - Drivers
      summary: Get tips?$params.toString()
      operationId: getDrivers$driveridTips?$params.tostring()
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: string
        - name: params.toString()
          in: path
          required: true
          schema:
            type: string
  /drivers/me/referrals/issuances?${params.toString()}:
    get:
      tags:
        - Drivers
      summary: Get issuances?$params.toString()
      operationId: getDriversMeReferralsIssuances?$params.tostring()
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      parameters:
        - name: params.toString()
          in: path
          required: true
          schema:
            type: string
  /drivers/me/referrals/summary?${params.toString()}:
    get:
      tags:
        - Drivers
      summary: Get summary?$params.toString()
      operationId: getDriversMeReferralsSummary?$params.tostring()
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      parameters:
        - name: params.toString()
          in: path
          required: true
