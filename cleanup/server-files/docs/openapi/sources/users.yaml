paths:
  /rider:
    get:
      tags: [Riders]
      summary: "Get rider profile"
      operationId: "riders.getProfile"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    
    put:
      tags: [Riders]
      summary: "Update rider profile"
      operationId: "riders.updateProfile"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /rider/uploadfiles:
    post:
      tags: [Riders]
      summary: "Upload rider files"
      operationId: "riders.uploadFiles"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /rider/sendnotification:
    get:
      tags: [Riders]
      summary: "Send notification"
      operationId: "riders.sendNotification"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "500":
          $ref: "#/components/responses/ServerError"
