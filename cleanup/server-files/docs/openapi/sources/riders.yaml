paths:
  /riders/me:
    get:
      tags:
        - Riders
      summary: Get current rider profile
      description: Retrieve the authenticated rider's profile information
      operationId: getRiderProfile
      responses:
        "200":
          description: Rider profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /riders/me/rides:
    get:
      tags:
        - Riders
      summary: Get rider's rides
      description: Retrieve the authenticated rider's ride history
      operationId: getRiderRides
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          description: Filter by ride status
          schema:
            type: string
            enum:
              - requested
              - accepted
              - in_progress
              - completed
              - cancelled
      responses:
        "200":
          description: Rides retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Ride"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /riders/me/referrals/issuances:
    get:
      tags:
        - Riders
      summary: Get rider's referral issuances
      description: Retrieve the authenticated rider's referral issuances
      operationId: getRiderReferralIssuances
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Referral issuances retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReferralIssuance"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /riders/me/promotions/active:
    get:
      tags:
        - Riders
      summary: Get active promotions for rider
      description: Retrieve promotions available to the authenticated rider
      operationId: getRiderActivePromotions
      responses:
        "200":
          description: Active promotions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /riders/${riderId}/tips?${params.toString()}:
    get:
      tags:
        - Riders
      summary: Get tips?$params.toString()
      operationId: getRiders$rideridTips?$params.tostring()
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      parameters:
        - name: riderId
          in: path
          required: true
          schema:
            type: string
        - name: params.toString()
          in: path
          required: true
          schema:
            type: string
  /riders/me/scheduled-rides:
    post:
      tags:
        - Riders
      summary: Create scheduled-rides
      operationId: postRidersMeScheduled-rides
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "TODO: Define request schema"
  /riders/me/scheduled-rides?${params.toString()}:
