paths:
  /admin/vehicle-classes:
    get:
      tags: [Admin]
      summary: "List vehicle classes"
      operationId: "admin.listVehicleClasses"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: "List of vehicle classes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  vehicle_classes:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleClass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    
    post:
      tags: [Admin]
      summary: "Create vehicle class"
      operationId: "admin.createVehicleClass"
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, display_name]
              properties:
                code:
                  type: string
                  description: "Vehicle class code"
                display_name:
                  type: string
                  description: "Human-readable name"
                is_enabled:
                  type: boolean
                  default: true
                base_fare_cents:
                  type: integer
                  default: 0
                per_km_cents:
                  type: integer
                  default: 0
                per_min_cents:
                  type: integer
                  default: 0
      responses:
        "201":
          description: "Vehicle class created"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  vehicle_class:
                    $ref: "#/components/schemas/VehicleClass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "Vehicle class already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /admin/vehicle-classes/{code}:
    get:
      tags: [Admin]
      summary: "Get vehicle class"
      operationId: "admin.getVehicleClass"
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
          description: "Vehicle class code"
      responses:
        "200":
          description: "Vehicle class details"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  vehicle_class:
                    $ref: "#/components/schemas/VehicleClass"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    
    patch:
      tags: [Admin]
      summary: "Update vehicle class"
      operationId: "admin.updateVehicleClass"
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
          description: "Vehicle class code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_enabled:
                  type: boolean
                base_fare_cents:
                  type: integer
                  minimum: 0
                per_km_cents:
                  type: integer
                  minimum: 0
                per_min_cents:
                  type: integer
                  minimum: 0
                display_name:
                  type: string
      responses:
        "200":
          description: "Vehicle class updated"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  vehicle_class:
                    $ref: "#/components/schemas/VehicleClass"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    
    delete:
      tags: [Admin]
      summary: "Delete vehicle class"
      operationId: "admin.deleteVehicleClass"
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
          description: "Vehicle class code"
      responses:
        "200":
          description: "Vehicle class deleted"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /admin:
    get:
      tags: [Admin]
      summary: "Get admin user details"
      operationId: "admin.getUserDetails"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
