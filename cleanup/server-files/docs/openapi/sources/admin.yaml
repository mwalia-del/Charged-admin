  /admin/dashboardstats:
    get:
      tags: [Admin]
      summary: "Get dashboard statistics"
      operationId: "admin.getDashboardStats"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /admin/rewards:
    get:
      tags: [Admin]
      summary: "Get rewards list"
      operationId: "admin.getRewards"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    
    post:
      tags: [Admin]
