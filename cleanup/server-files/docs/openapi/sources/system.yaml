paths:
  /health:
    get:
      tags: [System]
      summary: "Basic health check"
      operationId: "system.getHealth"
      description: "Basic health check endpoint for monitoring"
      responses:
        "200":
          description: "Service is healthy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: "Service is unhealthy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  
  /api/health:
    get:
      tags: [System]
      summary: "API health check"
      operationId: "system.getApiHealth"
      description: "Detailed API health check with service information"
      responses:
        "200":
          description: "API is healthy"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HealthResponse"
                  - type: object
                    properties:
                      service:
                        type: string
                        description: "Service name"
                      endpoints:
                        type: object
                        description: "Available endpoints"
        "500":
          description: "API is unhealthy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
