paths:
  /catalog/vehicle-classes:
    get:
      tags: [Catalog]
      summary: "Get public vehicle classes"
      operationId: "catalog.getVehicleClasses"
      description: "Get all enabled vehicle classes for public consumption"
      responses:
        "200":
          description: "List of enabled vehicle classes"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  vehicle_classes:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleClass"
        "500":
          $ref: "#/components/responses/ServerError"