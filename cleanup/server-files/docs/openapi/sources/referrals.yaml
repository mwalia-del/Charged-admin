paths:
  /admin/referrals/issuances:
    get:
      tags: [Referrals]
      summary: "Get referral issuances"
      operationId: "referrals.getIssuances"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  
  /referrals/claim:
    post:
      tags: [Referrals]
      summary: "Claim referral"
      operationId: "referrals.claim"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"