paths:
  /rides:
    post:
      tags:
        - Rides
      summary: Create a new ride
      description: Request a new ride with pickup and dropoff locations
      operationId: createRide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickupLocation
                - dropoffLocation
              properties:
                pickupLocation:
                  $ref: "#/components/schemas/Location"
                dropoffLocation:
                  $ref: "#/components/schemas/Location"
                vehicleClass:
                  type: string
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Ride created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /rides/{rideId}:
    get:
      tags:
        - Rides
      summary: Get ride details
      description: Retrieve detailed information about a specific ride
      operationId: getRideDetails
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Ride details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /rides/{rideId}/cancel:
    post:
      tags:
        - Rides
      summary: Cancel ride
      description: Cancel an active or scheduled ride
      operationId: cancelRide
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Ride cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  rideId:
                    type: string
                  status:
                    type: string
                    enum:
                      - cancelled
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /rides/${rideId}/tip:
    post:
      tags:
        - Rides
      summary: Create tip
      operationId: postRides$rideidTip
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "TODO: Define request schema"
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
