components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token for authentication"
  
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "Error code"
        message:
          type: string
          description: "Error message"
        details:
          type: string
          description: "Additional error details"
    
    Empty:
      type: object
      description: "Empty response"
    
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: "Service health status"
        timestamp:
          type: string
          format: date-time
          description: "Response timestamp"
        uptime:
          type: number
          description: "Service uptime in seconds"
        memory:
          type: object
          description: "Memory usage information"
        version:
          type: string
          description: "Service version"
    
    VehicleClass:
      type: object
      required: [code, display_name]
      properties:
        id:
          type: integer
          description: "Unique identifier"
        code:
          type: string
          description: "Vehicle class code"
        display_name:
          type: string
          description: "Human-readable name"
        is_enabled:
          type: boolean
          description: "Whether the vehicle class is enabled"
        base_fare_cents:
          type: integer
          description: "Base fare in cents"
        per_km_cents:
          type: integer
          description: "Price per kilometer in cents"
        per_min_cents:
          type: integer
          description: "Price per minute in cents"
        created_at:
          type: string
          format: date-time
          description: "Creation timestamp"
        updated_at:
          type: string
          format: date-time
          description: "Last update timestamp"
  
  responses:
    Ok:
      description: "OK"
      content:
        application/json:
          schema:
            type: object
    
    Created:
      description: "Created"
      content:
        application/json:
          schema:
            type: object
    
    Error:
      description: "Error response"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    BadRequest:
      description: "Bad Request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    Unauthorized:
      description: "Unauthorized"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    Forbidden:
      description: "Forbidden"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    NotFound:
      description: "Not Found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    Unprocessable:
      description: "Unprocessable Entity"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    ServerError:
      description: "Server Error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    
    ValidationError:
      description: "Validation Error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

